<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>YouTube AI Classifier</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            width: 100%;
            min-width: 300px;
            min-height: 440px;
            background: #0d0404;
            color: #fafafa;
            overflow-y: auto;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(239, 68, 68, 0.4);
        }

        .bg-glow {
            position: fixed;
            top: -60px;
            left: -60px;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(220, 38, 38, 0.25) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(40px);
            animation: floatGlow 6s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        .bg-glow-2 {
            position: fixed;
            bottom: -40px;
            right: -40px;
            width: 180px;
            height: 180px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.12) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(40px);
            animation: floatGlow 8s ease-in-out infinite reverse;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes floatGlow {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(20px, 15px) scale(1.1); }
        }

        .header {
            position: relative;
            z-index: 1;
            padding: 20px 24px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .header-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #ef4444, #f87171);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 15px;
            font-weight: 800;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(239, 68, 68, 0.4);
        }

        .header-text h1 {
            font-size: 15px;
            font-weight: 700;
            color: #fafafa;
            letter-spacing: -0.3px;
        }

        .header-text span {
            font-size: 11px;
            font-weight: 500;
            color: #a1a1aa;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .content {
            position: relative;
            z-index: 1;
            padding: 28px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .score-ring-container {
            position: relative;
            width: 160px;
            height: 160px;
            margin-bottom: 24px;
        }

        .score-ring-svg {
            width: 160px;
            height: 160px;
            transform: rotate(-90deg);
        }

        .score-ring-bg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.08);
            stroke-width: 8;
        }

        .score-ring-fill {
            fill: none;
            stroke-width: 8;
            stroke-linecap: round;
            stroke-dasharray: 408;
            stroke-dashoffset: 408;
            transition: stroke-dashoffset 1.5s cubic-bezier(0.4, 0, 0.2, 1),
                        stroke 0.5s ease;
            filter: drop-shadow(0 0 10px var(--ring-color, rgba(239, 68, 68, 0.6)));
        }

        .score-value {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .score-number {
            font-size: 42px;
            font-weight: 800;
            letter-spacing: -2px;
            line-height: 1;
            background: linear-gradient(135deg, #ffffff, #fca5a5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .score-label {
            font-size: 11px;
            font-weight: 600;
            color: #a1a1aa;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 4px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 100px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 20px;
            border: 1px solid;
        }

        .status-badge.high {
            background: rgba(34, 197, 94, 0.1);
            color: #4ade80;
            border-color: rgba(34, 197, 94, 0.2);
        }

        .status-badge.medium {
            background: rgba(251, 191, 36, 0.1);
            color: #fbbf24;
            border-color: rgba(251, 191, 36, 0.2);
        }

        .status-badge.low {
            background: rgba(239, 68, 68, 0.1);
            color: #f87171;
            border-color: rgba(239, 68, 68, 0.2);
        }

        .status-badge.neutral {
            background: rgba(161, 161, 170, 0.1);
            color: #a1a1aa;
            border-color: rgba(161, 161, 170, 0.2);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
            animation: pulse-dot 2s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .explanation-card {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 16px 18px;
            backdrop-filter: blur(12px);
        }

        .explanation-label {
            font-size: 10px;
            font-weight: 600;
            color: #fca5a5;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .explanation-text {
            font-size: 13px;
            font-weight: 400;
            color: #e4e4e7;
            line-height: 1.6;
        }

        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 40px 0;
        }

        .loading-spinner {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.08);
            border-top-color: #ef4444;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 13px;
            font-weight: 500;
            color: #a1a1aa;
        }

        .loading-dots::after {
            content: '';
            animation: dots 1.5s steps(3, end) infinite;
        }

        @keyframes dots {
            0% { content: ''; }
            33% { content: '.'; }
            66% { content: '..'; }
            100% { content: '...'; }
        }

        .info-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding: 40px 24px;
            text-align: center;
        }

        .info-icon {
            display: none;
        }

        .info-title {
            font-size: 16px;
            font-weight: 700;
            color: #fafafa;
        }

        .info-desc {
            font-size: 13px;
            color: #a1a1aa;
            line-height: 1.5;
        }

        .footer {
            position: relative;
            z-index: 1;
            padding: 14px 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .footer span {
            font-size: 10px;
            font-weight: 500;
            color: #52525b;
            letter-spacing: 0.3px;
        }

        .footer .gemini-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 8px;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.15), rgba(59, 130, 246, 0.15));
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
            color: #a78bfa;
        }

        .fade-in {
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    
    <div class="bg-glow"></div>
    <div class="bg-glow-2"></div>

    
    <div class="header">
        <div class="header-icon">AI</div>
        <div class="header-text">
            <h1>AI Classifier</h1>
            <span>Credibility Analysis</span>
            <div style="font-size: 10px; color: rgba(255, 255, 255, 0.4); margin-top: 2px;" id="user-info-display"></div>
        </div>
    </div>

    
    <div id="loading-state" class="content">
        <div class="loading-container">
            <div class="loading-spinner"></div>
            <div class="loading-text">Analyzing video<span class="loading-dots"></span></div>
        </div>
    </div>

    
    <div id="result-state" class="content hidden">
        <div class="score-ring-container">
            <svg class="score-ring-svg" viewBox="0 0 160 160">
                <circle class="score-ring-bg" cx="80" cy="80" r="65"></circle>
                <circle id="score-ring" class="score-ring-fill" cx="80" cy="80" r="65"></circle>
            </svg>
            <div class="score-value">
                <div id="score-number" class="score-number">--</div>
                <div class="score-label">out of 100</div>
            </div>
        </div>

        <div id="status-badge" class="status-badge neutral">
            <div class="status-dot"></div>
            <span id="status-text">Analyzing</span>
        </div>

        <div class="explanation-card">
            <div class="explanation-label">AI Analysis</div>
            <div id="explanation-text" class="explanation-text">—</div>
        </div>

        <div style="font-size: 10px; color: rgba(255, 255, 255, 0.35); text-align: center; margin-top: 16px; line-height: 1.4; max-width: 260px; font-family: 'Inter', sans-serif;">
            ⚠️ This credibility score is AI-generated and may contain inaccuracies. Please verify details independently.
        </div>
    </div>

    
    <div id="info-state" class="content hidden">
        <div class="info-container">
            <div id="info-icon" class="info-icon"></div>
            <div id="info-title" class="info-title">Not a Video Page</div>
            <div id="info-desc" class="info-desc">Navigate to a YouTube video to analyze its credibility.</div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="popup.js"></script>
</body>
</html>
